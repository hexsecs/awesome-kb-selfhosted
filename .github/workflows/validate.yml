name: Validate OpenShelf KB
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'git+https://github.com/OpenNorms/openshelf.git'
      - run: python tools/check.py
      - run: openshelf lint .
      - run: python tools/ingest.py --date 2026-11-04
      - run: git diff --exit-code
